<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body>
    <button onclick="
        console.log(`Cart Quantity: ${cartQuantity}`);
    ">show quantity</button>
    <button onclick="
        cartQuantity++;
        console.log(`Cart Quantity: ${cartQuantity}`);
    ">add to cart</button>
    <button onclick="
        cartQuantity += 2;
        console.log(`Cart Quantity: ${cartQuantity}`);    
    ">+2</button>
    <button onclick="
        cartQuantity += 3;
        console.log(`Cart Quantity: ${cartQuantity}`);
    ">+3</button>
    <button onclick="
        cartQuantity= 0;
        console.log('cart was reset.');
        console.log(`Cart Quantity: ${cartQuantity}`);
    ">reset cart</button>
    <script src="cart.js"></script>
</body>
</html>
