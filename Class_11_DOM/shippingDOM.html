<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shippingDOM</title>
</head>
<body>
    <p>amazon shipping</p>
    <p>free shipping if cost < $40</p>
    <p>shipping cost $10 if cost >= $40</p>
    <input placeholder="enter the cost" pattern="[0-9]+" id="js-cost-input" onkeydown="handleEnterKey(event);"> 
    <button onclick="calculate();">calculate</button>
    <p id="js-final-cost"></p>

    <script>
        function handleEnterKey(event){
            if(event.key==='Enter') calculate();
        }
        function calculate(){
            let cost = Number(document.querySelector('#js-cost-input').value);
            if(cost < 40){
                cost += 10;
            }
            
            let final_cost = document.querySelector('#js-final-cost');

            final_cost.innerHTML = `$${cost}`;
        }
    </script>
</body>
</html>
