<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Functions</title>
</head>
<body>
    
    <button class="js-btn">click</button>

    <script>
        function greeting(name) {
            console.log(`Hello, ${name}! Welcome to advanced functions.`);
        }
        greeting("Alice");

        const function1 = function() {
            console.log("This is a function expression.");
        };
        function1();
        console.log(function1); 
        console.log(typeof function1);


        const object1 = {
            num: 2,
            func: function() {
                console.log("Hello from the object method!");
            },

            hello: () => {
                console.log("Hello from the object method!");
            }
        };

        object1.func();
        object1.hello();



        setTimeout(function() {
            console.log("This message is displayed after 2 seconds.");
        }, 2000);
        console.log("next line of code after setTimeout");


        // loop through an array .forEach()
        [
            'make dinner',
            'wash dishes',
            'do laundry',
        ].forEach((task,index) => {
            if(task === 'wash dishes') return;  //continue
            console.log(`Task: ${task} (Index: ${index})`);
        })


        // arrow function
        const arrowFunction = () =>{
            console.log('arrowFunction');
        }
        arrowFunction()

        // addEventListener
        /*
            advantages:
            1. multiple listener can be added
            2. can remove eventlistener
        */
        const buttonElement = document.querySelector('.js-btn')
        buttonElement.addEventListener('click',()=>{
            console.log('click')
        })
        buttonElement.addEventListener('click',()=>{
            console.log('click2')
        })

        // loop through an array .filter()
        console.log([1,-3,5,-32].filter((value,index)=>{
             if(value>=0) return true
             else return false
        }))
        /*
        1. creates a new array []
        2. return true, 
                => put value in array
        3. return false,
                => not put value in array
        */




        //loop through an array .map()
        console.log([1,1,3].map((value,index)=>{
            return value + 10
        }))
        /*
            1. forEach()+filter()
            2. whatever we return it puts it in array
        */


        // shortcut for arrowfunction
        console.log([1,1,3].map(value => value + 10))


    </script>
</body> 
</html>
