<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-shortcut</title>
</head>
<body>
    
    <script>
        const object1 = {
            message : 'good bye',
            price : 490
        }
        // references;
        const object2 = object1;
        const object3 = {
            message : 'good bye',
            price : 490
        }
        // not equal even the properties are same;
        console.log(object1===object3);
        object2.price = 10;
        console.log(object1);

        console.log(object1===object2);

        //shortcuts
        // const message = object3.message;
        const {message} = object3;
        const {price} = object1;

        const object4 = {
            message: message,
            price,
            print(){
                console.log('method');
            }
        }
        object4.print();

        console.log(object4.price);

    </script>
</body>
</html>
